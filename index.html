<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Margaa | Kathmandu Public Transport Routing</title>
  <meta name="description" content="Plan multi-bus journeys across Kathmandu Valley. Built at Infinity Hackathon by TekBay Academy.">
  <meta name="theme-color" content="#f15a29">

  <!-- Fonts (graceful fallback to system fonts if blocked) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- Leaflet (jsdelivr is generally faster + more reliable in South Asia than unpkg) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Top-level error banner (hidden until something errors) -->
  <div id="errorBanner" class="error-banner" hidden></div>

  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <h1>Margaa<span class="dot"></span></h1>
        <div class="tagline" id="statsLine">Kathmandu Transit Network</div>
      </div>

      <nav class="tabs">
        <button class="tab active" data-view="plan">Trip Planner</button>
        <button class="tab" data-view="simulate">Simulation</button>
      </nav>

      <section class="view active" data-view="plan">
        <div class="search-wrap">
          <div class="search-bar">
            <span class="search-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.9"/>
                <path d="M16 16L21 21" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
              </svg>
            </span>
            <input type="text" id="searchInput" placeholder="Search any place in the valley…" autocomplete="off">
            <button class="search-icon-btn" id="locateBtn" title="Use my location" aria-label="Use my location">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 3V6" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
                <path d="M12 18V21" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
                <path d="M3 12H6" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
                <path d="M18 12H21" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
                <circle cx="12" cy="12" r="5.5" stroke="currentColor" stroke-width="1.9"/>
                <circle cx="12" cy="12" r="1.25" fill="currentColor"/>
              </svg>
            </button>
          </div>
          <div class="search-dropdown" id="searchDropdown"></div>
        </div>

        <div class="demos">
          <div class="demos-label">Try a sample trip</div>
          <div class="demos-row" id="demoTrips"></div>
        </div>

        <div class="io">
          <div class="io-row active" id="originRow">
            <div class="io-dot from"></div>
            <div class="io-text">
              <div class="io-label">From</div>
              <div class="io-value" id="originLabel">Tap on map, search, or pick a stop</div>
            </div>
          </div>
          <div class="io-row" id="destRow">
            <div class="io-dot to"></div>
            <div class="io-text">
              <div class="io-label">To</div>
              <div class="io-value" id="destLabel">Tap on map, search, or pick a stop</div>
            </div>
          </div>

          <div class="io-actions">
            <button class="btn-ghost" id="swapBtn">
              <span class="btn-ghost-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M7 7H19" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
                  <path d="M15 3L19 7L15 11" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
                  <path d="M17 17H5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
                  <path d="M9 13L5 17L9 21" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </span>
              <span>Swap</span>
            </button>
            <button class="btn-ghost" id="clearBtn">
              <span class="btn-ghost-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M6 6L18 18" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
                  <path d="M18 6L6 18" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
                </svg>
              </span>
              <span>Clear</span>
            </button>
          </div>
        </div>

        <div class="results-wrap">
          <div id="results"></div>
        </div>

        <div class="map-controls">
          <label class="toggle">
            <input type="checkbox" id="stopsToggle" checked>
            <span>Show all bus stops</span>
          </label>
        </div>

        <div class="legend-wrap" id="legendWrap">
          <button class="legend-toggle" id="legendToggle">
            <span>Lines</span>
            <span class="caret" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M6 9L12 15L18 9" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
          </button>
          <div class="legend" id="legend"></div>
        </div>

        <div class="foot">
          Hand-curated routes · CARTO basemap · Search powered by Nominatim<br>
          <strong>Margaa</strong> for fast public transport planning across Kathmandu Valley
        </div>
      </section>

            <section class="view" data-view="simulate">
        <div class="sim-panel" id="simPanel"></div>
      </section>
    </aside>

    <main id="map">
      <!-- If Leaflet fails to init, app.js will replace this content with an error message -->
      <div class="map-loading">Loading map...</div>
    </main>
  </div>

  <!-- Leaflet JS (jsdelivr, no crossorigin) -->
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- App -->
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
